<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API 站用量分析</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#242a34; --text:#e6e9ef; --dim:#8b95a5;
    --accent:#4f9cf9; --ok:#39c07a; --warn:#e0a33e; --bad:#e2564a; --gold:#d8a33c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06101d;font-weight:600}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
  .status{margin:12px 0;padding:9px 12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--dim);min-height:36px;display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok);border-color:#204a35}
  .status.bad{color:var(--bad);border-color:#5a2a26}

  /* 真实余额条 */
  .balance{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:14px 0 6px;padding:14px 18px;
    border-radius:10px;border:1px solid #3b3222;background:linear-gradient(90deg,#1c1a14,#161a21)}
  .balance .label{color:var(--dim);font-size:12px;letter-spacing:.06em}
  .balance .main{font-size:30px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
  .balance .side{color:var(--dim);font-size:12px}
  .balance .side b{color:var(--text);font-weight:600}

  /* 站点口径大行 */
  .official{margin:10px 0 16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#141821}
  .official .title{color:var(--dim);font-size:12px;letter-spacing:.06em;margin-bottom:8px}
  .official .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
  .official .cell .k{color:var(--dim);font-size:11px}
  .official .cell .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
  .official .stamp{color:var(--dim);font-size:11px;margin-top:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:16px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
  .card .k{color:var(--dim);font-size:12px}
  .card .v{font-size:19px;font-weight:600;margin-top:3px;word-break:break-all}
  section{margin:20px 0}
  section h2{font-size:13px;color:var(--dim);font-weight:600;margin:0 0 9px;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:12px;background:#1b2028;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bars{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .bar{display:grid;grid-template-columns:120px 1fr 120px;gap:10px;align-items:center;margin:5px 0;font-size:12px}
  .bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .bar .track{background:#1c222b;border-radius:4px;height:14px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#2f6fd0,#4f9cf9);border-radius:4px}
  .bar .val{text-align:right;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .scroll{max-height:460px;overflow:auto}
  .muted{color:var(--dim)}
  .tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#1e2632;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>API 站用量分析</h1>
    <select id="site"></select>
    <select id="range">
      <option value="consume">仅消费</option>
      <option value="all">全部记录</option>
    </select>
    <div class="spacer"></div>
    <button id="btnCheck">检查登录</button>
    <button id="btnLogin">去登录</button>
    <button id="btnFetch" class="primary">拉取数据</button>
  </header>

  <div class="status" id="status">就绪</div>

  <div class="balance">
    <div>
      <div class="label">真实余额（站点 /api/user/self）</div>
      <div class="main" id="balanceMain">—</div>
    </div>
    <div class="side" id="balanceSide"></div>
  </div>

  <div class="official">
    <div class="title">站点口径（dashboard / models 页那套数字 —— 与本地逐条汇总未必相等）</div>
    <div class="row" id="officialRow"></div>
    <div class="stamp" id="officialStamp"></div>
  </div>

  <div class="cards" id="cards"></div>

  <section>
    <h2>按模型</h2>
    <div class="bars" id="byModel"></div>
  </section>

  <div class="grid2">
    <section>
      <h2>按天</h2>
      <div class="bars" id="byDay"></div>
    </section>
    <section>
      <h2>按小时分布</h2>
      <div class="bars" id="byHour"></div>
    </section>
  </div>

  <div class="grid2">
    <section>
      <h2>按令牌</h2>
      <div class="bars" id="byToken"></div>
    </section>
    <section>
      <h2>按分组</h2>
      <div class="bars" id="byGroup"></div>
    </section>
  </div>

  <section>
    <h2>最近记录</h2>
    <div class="scroll">
      <table id="recent">
        <thead><tr>
          <th>时间</th><th>类型</th><th>模型</th><th>令牌</th>
          <th class="num">额度</th><th class="num">金额</th>
          <th class="num">输入</th><th class="num">输出</th><th class="num">缓存</th>
          <th class="num">t/s</th><th class="num">首字(ms)</th><th class="num">耗时(s)</th><th>流式</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TYPE_NAME = {1:'充值',2:'消费',3:'管理',4:'系统',5:'错误',6:'退款',7:'登录'};
let currentSite = '';
let timer = null;
let siteMap = {};

function fmtNum(n){ return (n===null||n===undefined)?'—':Number(n).toLocaleString('zh-CN'); }
function fmtAmount(v, sym){ return (v===null||v===undefined)?'—':sym + Number(v).toFixed(4); }
function fmtTokens(n){
  if(n===null||n===undefined) return '—';
  if(n >= 1e8) return (n/1e8).toFixed(1) + '亿';
  if(n >= 1e4) return (n/1e4).toFixed(1) + '万';
  return Number(n).toLocaleString('zh-CN');
}
function fmtTime(sec){ if(!sec) return '—'; const d=new Date(sec*1000); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setStatus(text, kind){
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function loadSites(){
  const r = await fetch('/api/sites').then(x=>x.json());
  if(!r.ok){ setStatus('站点清单读取失败', 'bad'); return; }
  const sel = $('site');
  sel.innerHTML = '';
  siteMap = {};
  r.sites.forEach(s => {
    siteMap[s.id] = s;
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.displayName + '（' + s.rows + ' 行）';
    sel.appendChild(o);
  });
  if(r.sites.length){ currentSite = r.sites[0].id; }
  sel.onchange = () => { currentSite = sel.value; loadAnalysis(); };
  renderOfficial();
}

function renderOfficial(){
  const s = siteMap[currentSite];
  const el = $('officialRow');
  if(!s || !s.snapshot){
    el.innerHTML = '<div class="cell"><div class="k">—</div><div class="v muted">未取到（点「拉取数据」会顺带拉一次）</div></div>';
    $('officialStamp').textContent = '';
    return;
  }
  const sn = s.snapshot;
  const sym = s.currencySymbol;
  const cells = [
    ['总数（调用次数）', fmtNum(sn.totalCount)],
    ['总额度', fmtAmount(sn.totalAmount, sym)],
    ['总 TOKEN 数', fmtTokens(sn.totalTokens)],
    ['平均 RPM', sn.avgRpm.toFixed(2)],
    ['平均 TPM', fmtTokens(Math.round(sn.avgTpm))],
  ];
  el.innerHTML = cells.map(c =>
    '<div class="cell"><div class="k">'+esc(c[0])+'</div><div class="v">'+esc(c[1])+'</div></div>').join('');
  $('officialStamp').textContent = '抓取于 ' + sn.fetchedAt + ' · 口径 = 站点 /api/data/self（近 24 小时窗口）';
}

function renderBalance(balance){
  const s = siteMap[currentSite];
  if(!s){ $('balanceMain').textContent = '—'; return; }
  if(!balance && balance !== 0){ $('balanceMain').textContent = '—'; $('balanceSide').textContent = '点「检查登录」取真实余额'; return; }
  const sym = s.currencySymbol;
  $('balanceMain').textContent = fmtAmount(balance / s.quotaPerUnit, sym);
  $('balanceSide').innerHTML = '原始 <b>' + fmtNum(balance) + '</b> quota · 换算 <b>1 ' + esc(sym) + ' = ' + fmtNum(s.quotaPerUnit) + ' quota</b>';
}

function renderBars(container, rows, sym, opts){
  opts = opts || {};
  const el = $(container);
  if(!rows || !rows.length){ el.innerHTML = '<div class="muted">暂无数据</div>'; return; }
  const max = Math.max.apply(null, rows.map(r => r.quota || 0)) || 1;
  el.innerHTML = rows.map(r => {
    const w = Math.max(1, Math.round((r.quota||0) / max * 100));
    const label = opts.label ? opts.label(r) : r.name;
    return '<div class="bar"><div class="name" title="'+esc(r.name)+'">'+esc(label)+'</div>' +
      '<div class="track"><div class="fill" style="width:'+w+'%"></div></div>' +
      '<div class="val">'+fmtAmount(r.amount, sym)+' <span class="muted">/ '+fmtNum(r.count)+'</span></div></div>';
  }).join('');
}

function renderCards(o, sym){
  const items = [
    ['本地记录数', fmtNum(o.count)],
    ['本地消费金额', fmtAmount(o.amount, sym)],
    ['本地额度', fmtNum(o.quota)],
    ['输入 Token', fmtNum(o.promptTokens)],
    ['输出 Token', fmtNum(o.completionTokens)],
    ['缓存 Token', fmtNum(o.cacheTokens)],
    ['缓存命中率', (o.cacheHitRate*100).toFixed(1) + '%'],
    ['平均首字', Math.round(o.avgFirstTokenMs) + ' ms'],
    ['平均耗时', o.avgUseTime.toFixed(2) + ' s'],
    ['平均速率', o.avgSpeedTps.toFixed(1) + ' t/s'],
    ['时间跨度', fmtTime(o.minCreatedAt) + ' → ' + fmtTime(o.maxCreatedAt)],
  ];
  $('cards').innerHTML = items.map(it =>
    '<div class="card"><div class="k">'+esc(it[0])+'</div><div class="v">'+esc(it[1])+'</div></div>').join('');
}

function renderRecent(rows, sym){
  const tb = $('recent').querySelector('tbody');
  if(!rows || !rows.length){ tb.innerHTML = '<tr><td colspan="13" class="muted">暂无数据</td></tr>'; return; }
  tb.innerHTML = rows.map(r =>
    '<tr>' +
    '<td>'+esc(fmtTime(r.createdAt))+'</td>' +
    '<td><span class="tag">'+esc(TYPE_NAME[r.type] || r.type)+'</span></td>' +
    '<td title="'+esc(r.upstreamModel)+'">'+esc(r.modelName || '—')+'</td>' +
    '<td>'+esc(r.tokenName || '—')+'</td>' +
    '<td class="num">'+fmtNum(r.quota)+'</td>' +
    '<td class="num">'+fmtAmount(r.amount, sym)+'</td>' +
    '<td class="num">'+fmtNum(r.promptTokens)+'</td>' +
    '<td class="num">'+fmtNum(r.completionTokens)+'</td>' +
    '<td class="num">'+fmtNum(r.cacheTokens)+'</td>' +
    '<td class="num">'+(r.speedTps > 0 ? r.speedTps.toFixed(0) : '—')+'</td>' +
    '<td class="num">'+(r.firstTokenMs > 0 ? r.firstTokenMs : '—')+'</td>' +
    '<td class="num">'+(r.useTime||'—')+'</td>' +
    '<td>'+(r.isStream ? '是' : '否')+'</td>' +
    '</tr>').join('');
}

async function loadAnalysis(){
  if(!currentSite) return;
  const range = $('range').value;
  const r = await fetch('/api/analysis?site=' + encodeURIComponent(currentSite) + '&range=' + range).then(x=>x.json());
  if(!r.ok){ setStatus('分析数据读取失败：' + (r.error||''), 'bad'); return; }
  const sym = r.site.currencySymbol;
  renderCards(r.overview, sym);
  renderBars('byModel', r.byModel, sym);
  renderBars('byDay', r.byDay, sym, {label: x => x.name});
  renderBars('byHour', r.byHour, sym, {label: x => x.name + ' 时'});
  renderBars('byToken', r.byToken, sym);
  renderBars('byGroup', r.byGroup, sym);
  renderRecent(r.recent, sym);
}

async function checkLogin(){
  if(!currentSite) return;
  setStatus('正在检查登录态…');
  const r = await fetch('/api/login-check', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({site: currentSite})
  }).then(x=>x.json());
  if(!r.ok){ setStatus('检查失败：' + (r.error||''), 'bad'); return; }
  if(r.loggedIn){
    renderBalance(r.quota);
    setStatus('已登录 · 用户 ' + r.username + ' · 请求数 ' + fmtNum(r.requestCount), 'ok');
  }else{
    renderBalance(null);
    setStatus((r.message || '未登录') + ' —— 点右上角「去登录」', 'bad');
  }
}

async function openLogin(){
  if(!currentSite) return;
  setStatus('正在打开浏览器…');
  const r = await fetch('/api/open-login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({site: currentSite})
  }).then(x=>x.json());
  if(!r.ok){ setStatus('打开失败：' + (r.error||''), 'bad'); return; }
  setStatus(r.message + '（登录完成后点「检查登录」）', 'ok');
}

async function startFetch(){
  if(!currentSite) return;
  const r = await fetch('/api/fetch', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({site: currentSite})
  }).then(x=>x.json());
  if(!r.ok){ setStatus('启动失败：' + (r.error||''), 'bad'); return; }
  setStatus('采集中…');
  poll();
}

async function poll(){
  if(timer) clearInterval(timer);
  timer = setInterval(async () => {
    const r = await fetch('/api/progress').then(x=>x.json());
    if(r.phase === 'running'){ setStatus('采集中 · ' + r.message); return; }
    clearInterval(timer); timer = null;
    if(r.phase === 'done'){
      setStatus(r.message, 'ok');
      if(r.balance) renderBalance(r.balance);
      await loadSites();
      await loadAnalysis();
    }
    else if(r.phase === 'failed'){ setStatus('失败：' + r.message, 'bad'); }
  }, 700);
}

$('btnCheck').onclick = checkLogin;
$('btnLogin').onclick = openLogin;
$('btnFetch').onclick = startFetch;
$('range').onchange = loadAnalysis;

(async function(){
  await loadSites();
  await loadAnalysis();
  await checkLogin();
})();
</script>
</body>
</html>
